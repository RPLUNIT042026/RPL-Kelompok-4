<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 290" width="1000" height="290" role="img" aria-label="BorrowMate - Pinjam apa saja, antar sesama mahasiswa">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E3EEE7"/>
      <stop offset="1" stop-color="#E9E4F2"/>
    </linearGradient>
    <clipPath id="frame"><rect width="1000" height="290" rx="26"/></clipPath>
    <clipPath id="typed"><rect x="48" y="170" width="0" height="40">
      <animate attributeName="width" from="0" to="470" dur="2.6s" begin="0.9s" fill="freeze"/>
    </rect></clipPath>
  </defs>
  <style>
    .serif{font-family:Georgia,'Times New Roman',serif}
    .sans{font-family:'Segoe UI',Helvetica,Arial,sans-serif}
    .fl{animation:fl 7s ease-in-out infinite}
    .fl2{animation:fl 9s ease-in-out infinite reverse}
    .fl3{animation:fl 6s ease-in-out infinite;animation-delay:-2s}
    @keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    .bob{animation:bob 3.2s ease-in-out infinite}
    @keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-9px) rotate(2deg)}}
    .rise{opacity:0;animation:rise .9s ease-out .2s forwards}
    @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
    .pill{opacity:0;animation:rise .7s ease-out forwards}
    .pop{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .6s cubic-bezier(.2,1.4,.4,1) forwards}
    @keyframes pop{from{opacity:0;transform:scale(.5)}to{opacity:1;transform:scale(1)}}
    .tw{transform-box:fill-box;transform-origin:center;animation:tw 2.8s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.25;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-in-out infinite}
    @keyframes pulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.5}}
    .drift{animation:drift 8s ease-in-out infinite}
    @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8px,-10px)}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}.rise,.pill,.pop{opacity:1!important}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1000" height="290" fill="url(#bg)"/>
    <!-- lingkaran dekoratif -->
    <circle class="fl"  cx="470" cy="10"  r="68"  fill="#D9D2EC" opacity=".75"/>
    <circle class="fl2" cx="930" cy="30"  r="115" fill="#F0D5CB" opacity=".8"/>
    <circle class="fl3" cx="15"  cy="285" r="95"  fill="#F0C9CF" opacity=".7"/>
    <circle class="fl"  cx="585" cy="290" r="85"  fill="#EADFB4" opacity=".75"/>
    <circle class="fl2" cx="975" cy="245" r="50"  fill="#C9D9E4" opacity=".85"/>

    <!-- chip atas -->
    <g class="pill" style="animation-delay:.1s">
      <rect x="48" y="36" width="190" height="30" rx="15" fill="#FFFFFF" opacity=".85"/>
      <circle class="pulse" cx="68" cy="51" r="5" fill="#7E9C92"/>
      <text class="sans" x="84" y="56" font-size="12" fill="#4E5F5A">Tugas kuliah · Sprint 2</text>
    </g>

    <!-- judul -->
    <g class="rise">
      <text class="serif" x="46" y="150" font-size="76" font-weight="700" fill="#2F4A44">BorrowMate</text>
    </g>

    <!-- subjudul efek mengetik -->
    <g clip-path="url(#typed)">
      <text class="serif" x="48" y="198" font-size="24" font-style="italic" fill="#4A5A66">Pinjam apa saja, antar sesama mahasiswa</text>
    </g>

    <!-- chip teknologi -->
    <g>
      <g class="pop" style="animation-delay:3.2s"><rect x="48" y="232" width="56" height="26" rx="13" fill="#BFD8CB"/><text class="sans" x="76" y="249" font-size="12" text-anchor="middle" fill="#2F4A44">Web</text></g>
      <g class="pop" style="animation-delay:3.4s"><rect x="114" y="232" width="118" height="26" rx="13" fill="#BCD3E0"/><text class="sans" x="173" y="249" font-size="12" text-anchor="middle" fill="#2F4A5E">Python + Django</text></g>
      <g class="pop" style="animation-delay:3.6s"><rect x="242" y="232" width="106" height="26" rx="13" fill="#D6CCEB"/><text class="sans" x="295" y="249" font-size="12" text-anchor="middle" fill="#46386B">Agile Scrum</text></g>
    </g>

    <!-- ilustrasi kanan -->
    <g>
      <!-- cincin berputar -->
      <circle cx="790" cy="150" r="82" fill="#FFFFFF" opacity=".35"/>
      <circle cx="790" cy="150" r="82" fill="none" stroke="#8FA9A0" stroke-width="5" stroke-linecap="round" stroke-dasharray="360 160">
        <animateTransform attributeName="transform" type="rotate" from="0 790 150" to="360 790 150" dur="9s" repeatCount="indefinite"/>
      </circle>

      <!-- hadiah -->
      <g class="bob">
        <rect x="754" y="138" width="72" height="56" rx="8" fill="#EDB3A5"/>
        <rect x="748" y="122" width="84" height="22" rx="7" fill="#F1BFB2"/>
        <rect x="783" y="122" width="14" height="72" fill="#E7D58B"/>
        <path d="M790 122 q-20 -24 -28 -8 q-4 12 28 8 z" fill="#E7D58B"/>
        <path d="M790 122 q20 -24 28 -8 q4 12 -28 8 z" fill="#E7D58B"/>
      </g>

      <!-- kartu melayang -->
      <g class="drift">
        <rect x="860" y="96" width="92" height="52" rx="10" fill="#FFFFFF" opacity=".92"/>
        <rect x="872" y="110" width="54" height="6" rx="3" fill="#A9C7BD"/>
        <rect x="872" y="124" width="38" height="6" rx="3" fill="#C9B8E4"/>
        <circle cx="938" cy="108" r="5" fill="#F0A8A0"/>
      </g>
      <g class="fl3">
        <rect x="656" y="196" width="92" height="46" rx="10" fill="#FFFFFF" opacity=".92"/>
        <circle cx="678" cy="219" r="11" fill="#A9C7BD"/>
        <path d="M672 219 l5 5 l9 -10" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="696" y="212" width="40" height="6" rx="3" fill="#C9B8E4"/>
        <rect x="696" y="224" width="26" height="5" rx="2.5" fill="#E3DBF1"/>
      </g>

      <!-- bintang berkelip -->
      <path class="tw" style="animation-delay:0s"   d="M600 60 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z" fill="#FFFFFF"/>
      <path class="tw" style="animation-delay:.9s"  d="M960 190 l3 9 l9 3 l-9 3 l-3 9 l-3 -9 l-9 -3 l9 -3 z" fill="#FFFFFF"/>
      <path class="tw" style="animation-delay:1.7s" d="M700 70 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" fill="#FFFFFF"/>
      <path class="tw" style="animation-delay:2.2s" d="M900 252 l2 6 l6 2 l-6 2 l-2 6 l-2 -6 l-6 -2 l6 -2 z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
