  <circle cx="90" cy="320" r="70" fill="#D5E4DB" opacity="0.5"/>

  <text x="72" y="168" font-family="Georgia, 'Times New Roman', serif" font-size="80" font-weight="700" fill="#2E4A42" letter-spacing="1">BorrowMate</text>
  <text x="74" y="222" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#4F6F63">Pinjam apa saja, antar sesama mahasiswa.</text>
  <text x="74" y="264" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-style="italic" fill="#7F9A8F">Rapi, jelas, tanpa drama.</text>

