<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-labelledby="t d">
  <title id="t">BorrowMate</title>
  <desc id="d">Dua orang saling meminjamkan sebuah kotak barang. Pinjam apa saja, antar sesama mahasiswa.</desc>
  <rect width="1200" height="340" rx="28" fill="#E6EEEA"/>
  <circle cx="1000" cy="150" r="190" fill="#D5E4DB" opacity="0.55"/>
