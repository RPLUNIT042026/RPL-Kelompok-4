<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1206" height="205" viewBox="0 0 1206 205" role="img" aria-labelledby="t d"><title id="t">Masalah, solusi, dan lingkup BorrowMate</title><desc id="d">Masalah: jadwal bentrok, barang lupa dikembalikan, tidak ada catatan. Solusi: diajukan, disetujui, diserahkan, dikembalikan, lalu tercatat sebagai riwayat dan ulasan. Lingkup: peminjaman berbasis kesepakatan, tanpa pembayaran dan tanpa pengiriman barang.</desc><defs></defs><g transform="translate(3,0)"><rect x="0" y="9" width="368" height="190" rx="22" fill="#2E4A42" opacity=".07"/><rect x="0" y="4" width="368" height="190" rx="22" fill="#F7E1E5" stroke="#C48A96" stroke-width="1.5"/><circle cx="46" cy="58" r="22" fill="#EDBFC8"/><path d="M46 47 Q46 58 57 58 Q46 58 46 69 Q46 58 35 58 Q46 58 46 47Z" fill="#fff" opacity="1"/><text x="82" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#6B3F4A" text-anchor="start" >Masalah</text><text x="28" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" fill="#6B3F4A" text-anchor="start" >Jadwal bentrok,</text><text x="28" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" fill="#6B3F4A" text-anchor="start" >barang lupa dikembalikan,</text><text x="28" y="166" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" fill="#6B3F4A" text-anchor="start" >dan tidak ada catatan.</text><rect x="416" y="9" width="368" height="190" rx="22" fill="#2E4A42" opacity=".07"/><rect x="416" y="4" width="368" height="190" rx="22" fill="#DDE8E2" stroke="#7FA391" stroke-width="1.5"/><circle cx="462" cy="58" r="22" fill="#B7D0C2"/><path d="M462 47 Q462 58 473 58 Q462 58 462 69 Q462 58 451 58 Q462 58 462 47Z" fill="#fff" opacity="1"/><text x="498" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#2E4A42" text-anchor="start" >Solusi</text><text x="444" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" fill="#2E4A42" text-anchor="start" >Diajukan, disetujui, diserahkan,</text><text x="444" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" fill="#2E4A42" text-anchor="start" >dikembalikan, lalu tercatat</text><text x="444" y="166" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" fill="#2E4A42" text-anchor="start" >sebagai riwayat dan ulasan.</text><rect x="832" y="9" width="368" height="190" rx="22" fill="#2E4A42" opacity=".07"/><rect x="832" y="4" width="368" height="190" rx="22" fill="#E6E0F2" stroke="#9A8CC0" stroke-width="1.5"/><circle cx="878" cy="58" r="22" fill="#D3C9EA"/><path d="M878 47 Q878 58 889 58 Q878 58 878 69 Q878 58 867 58 Q878 58 878 47Z" fill="#fff" opacity="1"/><text x="914" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="26" font-weight="bold" fill="#4A4068" text-anchor="start" >Lingkup</text><text x="860" y="114" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" fill="#4A4068" text-anchor="start" >Peminjaman berbasis kesepakatan,</text><text x="860" y="140" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" fill="#4A4068" text-anchor="start" >tanpa pembayaran dan</text><text x="860" y="166" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="normal" fill="#4A4068" text-anchor="start" >tanpa pengiriman barang.</text></g></svg>
